# Local mirrors of the jobs in .github/workflows/github_actions.yaml, so CI
# failures are caught before pushing.
#
# Install:
#   pre-commit install                          # pre-commit hook
#   pre-commit install --hook-type pre-push     # pre-push hook
#
# The ci-* hooks run the exact commands the CI jobs run. While the project
# venv is still being set up they warn and skip instead of failing.

repos:
  # --- workflow file hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml          # YAML syntax (workflows and other yaml files)
        stages: [commit, push]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint          # GitHub Actions semantics (if-exprs, action inputs, refs)
        stages: [commit, push]

  # --- CI job parity: lint-and-test ---
  # Each hook first runs `uv sync --frozen` (idempotent) so it tests against
  # the exact dependency set CI installs from uv.lock. If the venv is missing
  # packages this syncs them in; if uv.lock and pyproject.toml have drifted it
  # fails, same as CI.
  - repo: local
    hooks:
      # mirrors the "Install dependencies" + "Lint with flake8" steps
      - id: ci-flake8
        name: "CI parity: flake8 (lint-and-test)"
        entry: 'bash -c "if ! command -v uv >/dev/null 2>&1; then echo ''SKIP ci-flake8: uv not found on PATH (expected while the project venv is still being set up)''; exit 0; fi; uv sync --frozen && uv run flake8 . --extend-exclude=.venv --count --select=E9,F63,F7,F82,F401 --show-source --statistics"'
        language: system
        pass_filenames: false
        files: '^(src_v6/|test/|test_v6\.py|main\.py|pyproject\.toml|uv\.lock)'
        stages: [commit, push]

      # mirrors the "Vantage6 mock test" step
      - id: ci-mock-test
        name: "CI parity: vantage6 mock run (lint-and-test)"
        entry: 'bash -c "if ! command -v uv >/dev/null 2>&1; then echo ''SKIP ci-mock-test: uv not found on PATH (expected while the project venv is still being set up)''; exit 0; fi; uv sync --frozen && uv run python test_v6.py"'
        language: system
        pass_filenames: false
        files: '^(src_v6/|test/|test_v6\.py|pyproject\.toml|uv\.lock)'
        stages: [commit, push]

  # The build-and-push job's build step can be mirrored locally once the
  # Dockerfile has content:
  #   docker build -t onion-ci-smoke .
  # (the push itself needs GITHUB_TOKEN and only runs on tag pushes)
