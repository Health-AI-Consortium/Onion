name: Vantage6 Algorithm CI

on:
  push:
    branches:
      - main
    tags:
      - 'release/v*.*.*'
      - 'dev'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 vantage6-algorithm-tools==4.15.3

      - name: Lint with flake8
        run: |
          flake8 . --extend-exclude=.venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Vantage6 mock test
        run: python test_v6.py

  build-and-push:
    name: Build and Push Docker Image
    if: startsWith(github.ref, 'refs/tags/release/v') || github.ref == 'refs/tags/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Extract tag name
        id: extract_tag
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_TAG="${RAW_TAG#release/}"
          SAFE_TAG="${RAW_TAG//\//-}"
          echo "raw_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "safe_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Downcase REPO name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (release)
        if: startsWith(github.ref, 'refs/tags/release/v')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:latest
            ghcr.io/${{ env.REPO }}:${{ steps.extract_tag.outputs.release_tag }}

      - name: Build and push Docker image (dev)
        if: github.ref == 'refs/tags/dev'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./
          push: true
          tags: ghcr.io/${{ env.REPO }}:dev
