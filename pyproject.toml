[project]
name = "onion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.0",
    "vantage6==4.15.3",
    "vantage6-client==4.15.3",
    "vantage6-common==4.15.3",
    "vantage6-algorithm-store==4.15.3",
    "vantage6-algorithm-tools==4.15.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "flake8>=7.5.0",
]
